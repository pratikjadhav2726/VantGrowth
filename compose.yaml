# Local stack for GrowthOS Phase-0 checks: Postgres + NATS JetStream with GROWTHOS stream.
# Host ports avoid clashing with common local Postgres (5432) / NATS (4222).
#
# Usage:
#   pnpm infra:up
#   DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5488/growthos_ci pnpm migrate:dry-run
#   DATABASE_URL=... NATS_SERVERS=nats://127.0.0.1:4228 pnpm smoke:infra
#   pnpm infra:down

name: growthos-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: growthos_ci
    ports:
      - "5488:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d growthos_ci"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - growthos-postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4228:4222"
      - "8228:8222"
    volumes:
      - growthos-nats-js:/data

  jetstream-init:
    image: natsio/nats-box:0.14.5
    depends_on:
      - nats
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        NATS_URL="nats://nats:4222"
        sleep 2
        for i in $$(seq 1 60); do
          if nats --server "$$NATS_URL" stream info GROWTHOS >/dev/null 2>&1; then
            echo "JetStream stream GROWTHOS already exists."
            exit 0
          fi
          if nats --server "$$NATS_URL" stream add GROWTHOS --subjects "t.>" --defaults; then
            echo "Created JetStream stream GROWTHOS (subjects: t.>)."
            exit 0
          fi
          sleep 1
        done
        echo "Timed out waiting for NATS / stream creation."
        exit 1

volumes:
  growthos-postgres-data:
  growthos-nats-js:
