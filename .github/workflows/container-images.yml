name: Container images

on:
  push:
    branches: [main, master]
    paths:
      - "docker/**"
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "tsconfig.base.json"
      - ".github/workflows/container-images.yml"

  workflow_dispatch:

concurrency:
  group: container-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: growthos-api
            file: docker/api.Dockerfile
          - image: growthos-web
            file: docker/web.Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase owner (GHCR)
        id: meta
        run: |
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/${{ matrix.image }}:${{ github.sha }}
            ghcr.io/${{ steps.meta.outputs.owner_lc }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
