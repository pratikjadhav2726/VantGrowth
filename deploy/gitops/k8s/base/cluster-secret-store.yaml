# ClusterSecretStore — Vault AppRole backend
#
# Reads secrets from the Vault instance deployed alongside GrowthOS.
# Requires External Secrets Operator (ESO) v0.9+ in the cluster.
#
# Install ESO via Helm before applying:
#   helm repo add external-secrets https://charts.external-secrets.io
#   helm install external-secrets external-secrets/external-secrets \
#     --namespace external-secrets --create-namespace
#
# The Vault AppRole credentials (roleId + secretId) are bootstrapped
# once during cluster initialisation and stored as a Kubernetes Secret:
#   kubectl create secret generic growthos-vault-approle \
#     --namespace growthos \
#     --from-literal=roleId=<VAULT_ROLE_ID> \
#     --from-literal=secretId=<VAULT_SECRET_ID>
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: growthos-secret-store
spec:
  provider:
    vault:
      server: "http://openbao.growthos.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleId:
            secretRef:
              name: growthos-vault-approle
              namespace: growthos
              key: roleId
          secretRef:
            secretRef:
              name: growthos-vault-approle
              namespace: growthos
              key: secretId
