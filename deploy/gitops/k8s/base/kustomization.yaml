apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: growthos

resources:
  - namespace.yaml
  - api-deployment.yaml
  - api-service.yaml
  - web-deployment.yaml
  - web-service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: growthos
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
