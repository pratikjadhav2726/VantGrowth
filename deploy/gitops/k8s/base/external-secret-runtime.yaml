# ExternalSecret — growthos-runtime Kubernetes Secret
#
# Pulls all runtime secrets from Vault KV v2 and materialises them as the
# `growthos-runtime` Secret consumed by api-deployment.yaml as envFrom.
#
# Refresh interval: 1h.  ESO automatically rotates the Secret when Vault
# values change within one refresh cycle.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: growthos-runtime
  namespace: growthos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: growthos-secret-store
    kind: ClusterSecretStore
  target:
    name: growthos-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # ── Database ─────────────────────────────────────────────────────────────
    - secretKey: DATABASE_URL
      remoteRef:
        key: growthos/runtime/database
        property: url

    # ── API auth ──────────────────────────────────────────────────────────────
    - secretKey: GROWTHOS_API_SERVICE_TOKEN
      remoteRef:
        key: growthos/runtime/api
        property: service_token

    # ── OpenAI ────────────────────────────────────────────────────────────────
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: growthos/runtime/openai
        property: api_key

    # ── Postal (founder digest delivery) ──────────────────────────────────────
    - secretKey: POSTAL_API_KEY
      remoteRef:
        key: growthos/runtime/postal
        property: api_key
    - secretKey: POSTAL_SERVER_URL
      remoteRef:
        key: growthos/runtime/postal
        property: server_url

    # ── Restate workflow runtime ───────────────────────────────────────────────
    - secretKey: RESTATE_CALLBACK_SECRET
      remoteRef:
        key: growthos/runtime/restate
        property: callback_secret
    - secretKey: RESTATE_ADMIN_URL
      remoteRef:
        key: growthos/runtime/restate
        property: admin_url
    - secretKey: RESTATE_INGRESS_URL
      remoteRef:
        key: growthos/runtime/restate
        property: ingress_url

    # ── ClickHouse (LLM call log sink) ────────────────────────────────────────
    - secretKey: CLICKHOUSE_URL
      remoteRef:
        key: growthos/runtime/clickhouse
        property: http_url
    - secretKey: CLICKHOUSE_CREDENTIALS
      remoteRef:
        key: growthos/runtime/clickhouse
        property: credentials

    # ── Zitadel (tenant identity) ─────────────────────────────────────────────
    - secretKey: ZITADEL_DOMAIN
      remoteRef:
        key: growthos/runtime/zitadel
        property: domain
    - secretKey: ZITADEL_TOKEN
      remoteRef:
        key: growthos/runtime/zitadel
        property: service_account_token

    # ── Lago (billing) ────────────────────────────────────────────────────────
    - secretKey: LAGO_API_URL
      remoteRef:
        key: growthos/runtime/lago
        property: api_url
    - secretKey: LAGO_API_KEY
      remoteRef:
        key: growthos/runtime/lago
        property: api_key
