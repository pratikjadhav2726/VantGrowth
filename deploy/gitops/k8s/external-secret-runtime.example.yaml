# Example only — requires External Secrets Operator in the cluster.
# Copy to your overlay, set cluster-specific store + remote paths, then apply.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: growthos-runtime
  namespace: growthos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: growthos-secret-store
    kind: ClusterSecretStore
  target:
    name: growthos-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: growthos/prod/database
        property: url
    - secretKey: GROWTHOS_API_SERVICE_TOKEN
      remoteRef:
        key: growthos/prod/api
        property: service_token
