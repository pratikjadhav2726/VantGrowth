apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Same as `overlays/dev` (environment label) plus private-registry pull for API + web.
resources:
  - ../../base

patches:
  - path: api-deployment-pull.yaml
  - path: web-deployment-pull.yaml

labels:
  - pairs:
      environment: dev
    includeSelectors: true
