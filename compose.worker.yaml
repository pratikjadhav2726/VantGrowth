# GrowthOS Paperclip heartbeat worker — the GrowthOS-side executor for
# `growthos_native` agents. Polls Paperclip for runnable issues assigned to
# approved agents and dispatches them into the GrowthOS domain workers.
#
# Joins the existing growthos-dev network so it can reach both the GrowthOS API
# and Paperclip (http://paperclip:3100).
#
#   docker compose -f compose.worker.yaml up -d --build
#
# Defaults to DRY-RUN (logs candidate work, no mutations). Set
# PAPERCLIP_HEARTBEAT_DRY_RUN=false to actually check out + dispatch.

name: growthos-worker

x-env: &env
  env_file: .env

services:
  worker-paperclip-heartbeat:
    build:
      context: .
      dockerfile: docker/worker.dev.Dockerfile
    <<: *env
    environment:
      NODE_ENV: development
      WORKER_BOOTSTRAP: "true"
      # PAPERCLIP_BASE_URL / PAPERCLIP_SERVICE_TOKEN come from .env.
      # Override BASE_URL for the in-network hostname:
      PAPERCLIP_BASE_URL: "http://paperclip:3100"
      # Companies this worker services (comma-separated). Defaults to the
      # Insurance company E2E company created during integration testing.
      PAPERCLIP_HEARTBEAT_COMPANY_IDS: "${PAPERCLIP_HEARTBEAT_COMPANY_IDS:-6089ae0f-8e93-4233-bb68-41aa29fbf561}"
      PAPERCLIP_HEARTBEAT_POLL_MS: "15000"
      PAPERCLIP_HEARTBEAT_DRY_RUN: "${PAPERCLIP_HEARTBEAT_DRY_RUN:-true}"
    volumes:
      - ./apps/worker-paperclip-heartbeat/src:/app/apps/worker-paperclip-heartbeat/src:ro
      - ./packages:/app/packages:ro
    restart: unless-stopped
    networks:
      growthos:
        aliases: [worker-paperclip-heartbeat]

networks:
  growthos:
    external: true
    name: growthos-dev_default
